# Port 8000 rather than 80 because the test suite asks for it by name:
# tests/TestEnvironment.php builds its Guzzle client against
# http://localhost:8000 and phpunit runs in this container. The host port from
# docker/.env is mapped onto this one.
<VirtualHost *:8000>
    ServerName localhost
    DocumentRoot /var/www/html

    # To the container log, so `fa-api logs app` shows something. Debian's
    # default sends both to files under /var/log/apache2, where nothing looks.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# The module's own .htaccess is what routes every request to index.php:
#
#   RewriteCond %{REQUEST_FILENAME} !-f
#   RewriteRule ^ index.php [QSA,L]
#
# Debian's default vhost sets AllowOverride None for /var/www, which would
# discard that silently — every endpoint would 404 while the site itself looked
# fine. FrontAccounting's own root .htaccess, which denies direct fetches of
# .inc and .sql files, needs it back on for the same reason.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Nothing under these is fetched over HTTP, and they hold credentials, database
# dumps, and the git history of two repositories.
<DirectoryMatch "/var/www/html/(\.git|docker|node_modules|install/lang)">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "/var/www/html/modules/api/(\.git|docker|node_modules|tests/data)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(config\.php|config_db\.php|installed_extensions\.php)$">
    Require all denied
</FilesMatch>

<DirectoryMatch "/var/www/html/company/[^/]+/(backup|attachments)">
    Require all denied
</DirectoryMatch>
